# Render blueprint for the admin dashboard (API + UI in one service).
#
# Deploy: Render → New → Blueprint → pick this repo. Everything marked
# `sync: false` is a secret you type into Render's environment editor;
# nothing secret belongs in this file.
#
# No database is defined here — the app points at an existing MongoDB via
# MONGODB_URI.
#
# ── Why `free` ──────────────────────────────────────────────────────────
# The free plan runs a real Node process, which is what this needs. Two
# costs, both real:
#
#   1. It SLEEPS after 15 minutes idle. The next request takes ~30–50s to
#      wake it. Tolerable for a dashboard; noticeable in the app, which
#      calls /api/content on launch and will fall back to bundled content
#      while it waits.
#   2. It cannot mount a disk, so UPLOADED IMAGES ARE LOST ON EVERY DEPLOY.
#      Paste absolute image URLs into the dashboard instead of uploading,
#      or move to `starter` and re-add the `disk:` block (see DEPLOY.md).
#
# Switching to paid later is two lines: plan → starter, and restore the
# disk + UPLOAD_DIR entries documented in docs/DEPLOY.md.

services:
  - type: web
    name: pooja-admin
    runtime: node
    plan: free
    region: singapore # closest Render region to India
    rootDir: pooja-admin
    # `--include=dev` is load-bearing: NODE_ENV=production below makes npm
    # skip devDependencies, and vite — which builds the dashboard UI — is
    # one. Without it the build dies with `sh: 1: vite: not found`.
    buildCommand: npm ci --include=dev && npm run build
    # `serve`, not `start`: start would rebuild the UI on every boot.
    startCommand: npm run serve
    healthCheckPath: /api/health
    # CI deploys, not Render. A push that fails lint, typecheck or the gate
    # smoke test must not reach production just because it was pushed.
    autoDeploy: false

    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 20.19.4
      # Render provides PORT; the server already honours it.
      - key: MONGODB_URI
        sync: false # must name a database of its OWN — see DEPLOY.md
      - key: ADMIN_PASSWORD
        sync: false # production refuses to start without this
      - key: ADMIN_SESSION_SECRET
        generateValue: true # keeps sessions alive across a password change
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false # the whole service-account JSON, on one line
      # The app talks to this API from a phone, not a browser, so CORS is
      # only about the dashboard — which is same-origin.
      - key: CORS_ORIGIN
        value: '*'
