# Render blueprint — the backend only.
#
# The dashboard is a static bundle and lives on Netlify (see
# pooja-admin/netlify.toml); only the API needs a Node process, and Render
# hosts that.
#
# Deploy: Render → New → Blueprint → this repo. Secrets (`sync: false`) are
# typed into Render; nothing secret belongs in this file.
#
# ── Order matters on first deploy ──────────────────────────────────────
# Netlify bakes this service's URL into the dashboard bundle at BUILD time,
# so bring this up first. Once the dashboard has a URL of its own, come
# back and set CORS_ORIGIN to it — until then the dashboard cannot call
# this at all.

services:
  - type: web
    name: pooja-api
    runtime: node
    plan: free
    region: singapore
    rootDir: pooja-api
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    # CI deploys, not Render: a push that fails the gate smoke test must not
    # reach production just because it was pushed.
    autoDeploy: false

    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 20.19.4
      - key: MONGODB_URI
        sync: false # must name a database of its OWN — see docs/DEPLOY.md
      - key: ADMIN_PASSWORD
        sync: false # bootstraps the first operator; production will not boot without it
      - key: ADMIN_SESSION_SECRET
        generateValue: true
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false # the whole service-account JSON, on one line
      # The dashboard is a different origin now, so this CANNOT stay '*':
      # the browser refuses a wildcard origin on a credentialed request, and
      # every dashboard call would fail. Set it to the Netlify URL.
      - key: CORS_ORIGIN
        sync: false # e.g. https://pooja-admin.netlify.app
      # The dashboard is a separate site, so the session cookie is
      # cross-origin and `Strict` would stop the browser sending it at all —
      # sign-in would appear to work and every call after it would 401.
      # `None` requires HTTPS, which Render terminates.
      - key: SESSION_SAMESITE
        value: None
