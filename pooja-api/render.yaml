# Blueprint: the API.  (The dashboard has its own, in pooja-admin/.)
#
# Two files, two Blueprints, because the two services have different
# lifecycles: the dashboard is a static site that occasionally has to be
# deleted and recreated — a service's TYPE cannot be changed once it
# exists — and doing that should never put the API at risk.
#
# Render looks for `render.yaml` at the REPO ROOT by default, and this is
# not there. Set **Blueprint Path** to `pooja-api/render.yaml` when you
# create or edit this Blueprint; the dashboard's is `pooja-admin/render.yaml`.
#
# Paths inside a Blueprint — `rootDir` here — stay relative to the REPO
# ROOT, not to this file. Moving the file does not change them.
#
# ── Adopting an existing service ──────────────────────────────────────
# Render matches a Blueprint to a service BY NAME. The pre-split service
# was called `pooja-admin` and ran this API; rename it to `pooja-api` in
# Render → Settings before syncing, or you get a duplicate.
#
# ── Why CORS_ORIGIN is typed and not `fromService` ───────────────────
# It used to read the dashboard's host with `fromService`. That is a hard
# dependency: Render refuses to sync a Blueprint whose reference does not
# resolve —
#
#     env var depends on non-existent service: {web pooja-admin}
#
# — and the dashboard is precisely the service that has to be deleted and
# recreated, because a service's TYPE cannot be changed. So the reference
# broke at the exact moment it was most needed, and it made these two
# Blueprints a cycle: each refused to sync until the other existed.
#
# One direction of dependency is fine, a cycle is not. The dashboard still
# reads the API's host automatically — the API is the stable end — and
# this one value is typed once instead.

services:
  - type: web
    name: pooja-api
    runtime: node
    plan: free
    region: singapore
    rootDir: pooja-api
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    # CI deploys, not Render: a push that fails the gate smoke test must not
    # reach production just because it was pushed.
    autoDeploy: false

    # No disk, and none needed: uploaded media lives in MongoDB (GridFS),
    # not on the container filesystem. That filesystem is ephemeral and the
    # free plan cannot mount a disk, so anything written there was lost on
    # every deploy — which, once the app stopped shipping media of its own,
    # meant the whole sanctum went blank. The storage constraint is now the
    # database's: Atlas M0 is 512MB for documents AND media together.

    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 20.19.4
      # Biggest file the dashboard may upload. Uploads are buffered in
      # memory on their way to the database, so this is a memory ceiling
      # as much as a policy one — the free instance has 512MB.
      - key: MAX_UPLOAD_MB
        value: 25
      - key: MONGODB_URI
        sync: false # must name a database of its OWN — see docs/DEPLOY.md
      - key: ADMIN_PASSWORD
        sync: false # bootstraps the first operator; production will not boot without it
      - key: ADMIN_SESSION_SECRET
        generateValue: true
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false # the whole service-account JSON, on one line
      # Buying coins (Razorpay) and astrologer calls (Agora). With none of these
      # set the server stays up and answers those two features with 503 — it never
      # falls back to the development "mock" providers in production. Set the pair
      # for each feature you turn on; see docs/PAYMENTS_SETUP.md and docs/CALLS_SETUP.md.
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false # the secret you type into Razorpay's webhook settings
      - key: AGORA_APP_ID
        sync: false
      - key: AGORA_APP_CERTIFICATE
        sync: false
      - key: YOUTUBE_API_KEY
        sync: false # live darshan: verifies YouTube streams are broadcasting
      # The dashboard's URL, e.g. https://pooja-admin.onrender.com — or just
      # the bare host, which the API turns into https:// itself (see
      # `allowedOrigins` in src/config/cors.js). A trailing slash is tolerated.
      #
      # It cannot be '*': the browser forbids a wildcard origin on a
      # credentialed request, and the admin session is a cookie, so every
      # dashboard call would be refused.
      #
      # Comma-separate to allow more than one.
      - key: CORS_ORIGIN
        sync: false
      # The dashboard is a separate origin, so the session cookie is
      # cross-site and `Strict` would stop the browser sending it at all —
      # sign-in would appear to work and every call after it would 401.
      # `None` requires HTTPS, which Render terminates.
      - key: SESSION_SAMESITE
        value: None
